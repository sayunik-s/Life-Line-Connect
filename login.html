<body>
    <div class="login-card">
        <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
            </svg>
        </div>

        <h2>LifeLine Connect</h2>
        <p class="subtitle">Central Blood Bank Portal</p>

        <!-- PHP Errors (If using a backend) -->
        <?php if (!empty($error)): ?>
            <div class="alert-error" style="display: block;"><?php echo $error; ?></div>
        <?php endif; ?>

        <?php if (!empty($success)): ?>
            <div class="alert-success" style="display: block;"><?php echo $success; ?></div>
        <?php endif; ?>

        <!-- Notification Boxes -->
        <div id="jsErrorBox" class="alert-error"></div>
        <div id="jsSuccessBox" class="alert-success"></div>

        <form id="loginForm" onsubmit="return validateLogin(event)">
            <div class="input-group">
                <input type="text" id="username" name="username" placeholder="Username" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password">
            </div>
            
            <button type="submit" id="loginBtn" class="btn btn-red">Login</button>
        </form>

        <hr class="divider">
        <p class="register-prompt">Don't have an account?</p>
        <a href="registration1.html" class="btn btn-gray">Register / Sign Up</a>
    </div>

    <!-- JavaScript AJAX / Fetch Logic -->
    <script>
        function validateLogin(event) {
            event.preventDefault(); // Prevent default page reload

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorBox = document.getElementById('jsErrorBox');
            const successBox = document.getElementById('jsSuccessBox');
            const loginBtn = document.getElementById('loginBtn');

            // Reset errors
            usernameInput.classList.remove('input-error');
            passwordInput.classList.remove('input-error');
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            errorBox.innerHTML = '';

            let isValid = true;
            let errorMessages = [];

            // JS Validations
            if (usernameInput.value.trim() === "") {
                errorMessages.push("Username is required.");
                usernameInput.classList.add('input-error');
                isValid = false;
            }

            if (passwordInput.value.trim() === "") {
                errorMessages.push("Password is required.");
                passwordInput.classList.add('input-error');
                isValid = false;
            } else if (passwordInput.value.trim().length < 4) {
                errorMessages.push("Password must be at least 4 characters long.");
                passwordInput.classList.add('input-error');
                isValid = false;
            }

            // Stop if JS validation fails
            if (!isValid) {
                errorBox.innerHTML = errorMessages.join('<br>');
                errorBox.style.display = 'block';
                return false;
            }

            // If JS validation passes, Send data to PHP backend
            loginBtn.innerHTML = "Authenticating...";
            loginBtn.disabled = true;

            const formData = new FormData(document.getElementById('loginForm'));

            fetch('login.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loginBtn.innerHTML = "Login";
                loginBtn.disabled = false;

                if (data.status === 'success') {
                    // Login Successful
                    successBox.innerHTML = data.message;
                    successBox.style.display = 'block';
                    
                    // Redirect to specific dashboard based on backend response
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    // PHP Backend Error (e.g. Wrong password or username not found)
                    errorBox.innerHTML = data.message;
                    errorBox.style.display = 'block';
                }
            })
            .catch(error => {
                loginBtn.innerHTML = "Login";
                loginBtn.disabled = false;
                errorBox.innerHTML = "Server connection error. Please try again later.";
                errorBox.style.display = 'block';
            });
        }
    </script>
</body>
</html>
