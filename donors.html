<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine Connect - Donors List</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f4f7fe; color: #2b3674; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #ffffff; padding: 24px 20px; border-right: 1px solid #e0e5f2; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; color: #d32f2f; }
        .brand-icon { width: 40px; height: 40px; background: #ffebee; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .brand h2 { font-size: 18px; font-weight: 700; line-height: 1.2; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: #a3aed1; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #d32f2f; color: white; }
        .main-content { flex: 1; padding: 32px; overflow-y: auto; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; color: #2b3674; font-weight: 700; }
        .user-profile { display: flex; align-items: center; gap: 16px; }
        .logout-btn { padding: 8px 16px; background: #ffebee; color: #d32f2f; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-bottom: 24px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .card-header h3 { font-size: 16px; color: #2b3674; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e0e5f2; font-size: 14px; }
        th { color: #a3aed1; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        td { color: #2b3674; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
            <h2>LifeLine<br>Connect</h2>
        </div>
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="donors.html" class="nav-item active">Donors & Eligibility</a>
            <a href="camps.html" class="nav-item">Camps & Staff</a>
            <a href="hospitals.html" class="nav-item">Hospital Requests</a>
            <a href="community.html" class="nav-item">Community Q&A</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Registered Donors</h1>
                <p style="font-size: 14px; color: #a3aed1; margin-top: 4px;">Live Connected to Database</p>
            </div>
            <div class="user-profile">
                <span style="font-size: 14px; font-weight: 600;">System Admin</span>
                <a href="login.html" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>All Donors List</h3>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Username</th>
                            <th>Age</th>
                            <th>Blood Group</th>
                        </tr>
                    </thead>
                    <tbody id="donorsTableBody">
                        <tr><td colspan="5" style="text-align: center;">Loading donors data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // මේ සඳහා admin_donors_api.php එකක් සාදා SELECT * FROM donors ධාවනය කළ යුතුය.
            // දැනට UI එක වැඩ කිරීමට Mock Data එකක් මෙහි දමා ඇත.
            const tbody = document.getElementById('donorsTableBody');
            
            // PHP API එක හැදුවොත් fetch('admin_donors_api.php') ලෙස මාරු කරන්න.
            const mockDonors = [
                {id: 1, name: "Amal Silva", username: "amal", age: 25, bg: "O+"},
                {id: 2, name: "Nimal Fernando", username: "nimal99", age: 30, bg: "A-"},
                {id: 3, name: "Samantha Perera", username: "sam", age: 28, bg: "B+"}
            ];

            tbody.innerHTML = '';
            mockDonors.forEach(donor => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${donor.id}</td>
                        <td>${donor.name}</td>
                        <td>${donor.username}</td>
                        <td>${donor.age}</td>
                        <td style="color:#d32f2f; font-weight:bold;">${donor.bg}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
