<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine Connect - Community Feed</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f4f7fe; color: #2b3674; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #ffffff; padding: 24px 20px; border-right: 1px solid #e0e5f2; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; color: #d32f2f; }
        .brand-icon { width: 40px; height: 40px; background: #ffebee; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .brand h2 { font-size: 18px; font-weight: 700; line-height: 1.2; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: #a3aed1; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #d32f2f; color: white; }
        .main-content { flex: 1; padding: 32px; overflow-y: auto; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; color: #2b3674; font-weight: 700; }
        .user-profile { display: flex; align-items: center; gap: 16px; }
        .logout-btn { padding: 8px 16px; background: #ffebee; color: #d32f2f; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .logout-btn:hover { background: #ffcdd2; }
        .grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-bottom: 24px; }
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .card-header h3 { font-size: 16px; color: #2b3674; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
        input, select, textarea { width: 100%; padding: 12px; border: 1.5px solid #e0e5f2; border-radius: 8px; font-size: 14px; outline: none; background: white; transition: 0.2s; font-family: inherit; }
        input:focus, select:focus, textarea:focus { border-color: #d32f2f; }
        textarea { resize: vertical; min-height: 80px; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #d32f2f 0%, #9a1212 100%); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; margin-top: 10px; transition: 0.2s; }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(211,47,47,0.2); }
        .feed-container { display: flex; flex-direction: column; gap: 16px; }
        .feed-post { padding: 16px; border: 1px solid #e0e5f2; border-radius: 12px; background: #fafbfc; position: relative; }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .post-author { font-size: 14px; font-weight: 700; color: #2b3674; }
        .post-date { font-size: 12px; color: #a3aed1; }
        .post-body { font-size: 14px; color: #4a5568; line-height: 1.5; margin-bottom: 12px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-emergency { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .badge-review { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .badge-qa { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .rating { color: #f5b041; font-size: 14px; margin-top: 8px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
            <h2>LifeLine<br>Connect</h2>
        </div>
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="donors.html" class="nav-item">Donors & Eligibility</a>
            <a href="camps.html" class="nav-item">Camps & Staff</a>
            <a href="hospitals.html" class="nav-item">Hospital Requests</a>
            <a href="community.html" class="nav-item active">Community Q&A</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Community & Emergency Feed</h1>
                <p style="font-size: 14px; color: #a3aed1; margin-top: 4px;">Live Connected to Database</p>
            </div>
            <div class="user-profile">
                <span style="font-size: 14px; font-weight: 600;">System Admin</span>
                <a href="login.html" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="grid-2">
            <div class="card" style="height: fit-content;">
                <div class="card-header">
                    <h3>Create Broadcast / Post</h3>
                </div>
                <form id="postForm" onsubmit="addPost(event)">
                    <div class="form-group">
                        <label>Post Type</label>
                        <select id="pType" name="type" onchange="toggleRatingField()" required>
                            <option value="QA">Community Q&A</option>
                            <option value="Review">Camp Feedback / Review</option>
                            <option value="Emergency">🚨 Emergency Appeal</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Author / Hospital Name</label>
                        <input type="text" id="pAuthor" name="author" placeholder="E.g. Kamal Perera or General Hospital" required>
                    </div>
                    <div class="form-group">
                        <label>Message / Description</label>
                        <textarea id="pBody" name="body" placeholder="Type your message here..." required></textarea>
                    </div>
                    <div class="form-group" id="ratingGroup" style="display: none;">
                        <label>Rating (Out of 5 Stars)</label>
                        <select id="pRating" name="rating">
                            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                            <option value="4">⭐⭐⭐⭐ (4/5)</option>
                            <option value="3">⭐⭐⭐ (3/5)</option>
                            <option value="2">⭐⭐ (2/5)</option>
                            <option value="1">⭐ (1/5)</option>
                        </select>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-submit">Publish to Feed</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Live Community Feed</h3>
                </div>
                <div class="feed-container" id="feedContainer">
                    <p style="text-align:center;">Loading Feed...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleRatingField() {
            const type = document.getElementById('pType').value;
            document.getElementById('ratingGroup').style.display = (type === "Review") ? "block" : "none";
        }

        function getStars(num) {
            return '⭐'.repeat(num);
        }

        function loadFeed() {
            fetch('community_api.php?action=fetch')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') renderFeed(data.data);
                });
        }

        function renderFeed(posts) {
            const container = document.getElementById('feedContainer');
            container.innerHTML = ''; 
            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#757575;">No posts available yet.</p>';
                return;
            }
            posts.forEach(post => {
                let badgeClass = '';
                let badgeText = '';
                let ratingHtml = '';

                if (post.post_type === 'Emergency') { badgeClass = 'badge-emergency'; badgeText = 'Emergency Appeal'; } 
                else if (post.post_type === 'Review') { badgeClass = 'badge-review'; badgeText = 'Camp Review'; ratingHtml = `<div class="rating">Rating: ${getStars(post.rating)}</div>`; } 
                else if (post.post_type === 'QA') { badgeClass = 'badge-qa'; badgeText = 'Community Q&A'; }

                container.innerHTML += `
                    <div class="feed-post">
                        <div class="post-header">
                            <span class="post-author">${post.author_name}</span>
                            <span class="badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="post-date">${post.formatted_date}</div>
                        <div class="post-body">${post.message_body}</div>
                        ${ratingHtml}
                    </div>
                `;
            });
        }

        function addPost(event) {
            event.preventDefault(); 
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Publishing...";
            submitBtn.disabled = true;

            fetch('community_api.php?action=add', {
                method: 'POST',
                body: new FormData(document.getElementById('postForm'))
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('postForm').reset();
                    toggleRatingField(); 
                    loadFeed(); 
                } else alert(data.message);
            })
            .finally(() => {
                submitBtn.innerText = "Publish to Feed";
                submitBtn.disabled = false;
            });
        }

        document.addEventListener("DOMContentLoaded", loadFeed);
    </script>
</body>
</html>
