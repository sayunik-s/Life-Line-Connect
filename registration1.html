<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine Connect - Donor Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #fff5f5 0%, #fed7d7 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 40px 32px; border-radius: 16px; box-shadow: 0 20px 40px rgba(154, 18, 18, 0.08); width: 100%; max-width: 450px; text-align: center; }
        .brand-icon { width: 54px; height: 54px; background: #ffebee; color: #d32f2f; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; }
        h2 { color: #b71c1c; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: #757575; font-size: 13px; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 14px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #4a5568; }
        input, select, textarea { width: 100%; padding: 12px 16px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; font-family: inherit; }
        input:focus, select:focus, textarea:focus { border-color: #d32f2f; box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.1); }
        .input-error { border-color: #d32f2f !important; background-color: #fff5f5; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center; transition: 0.2s; }
        .btn-red { background: linear-gradient(135deg, #d32f2f 0%, #9a1212 100%); color: white; box-shadow: 0 4px 12px rgba(211, 47, 47, 0.25); }
        .btn-red:hover { background: linear-gradient(135deg, #b71c1c 0%, #7f0000 100%); }
        .btn-gray { background-color: #f5f5f5; color: #424242; border: 1px solid #e0e0e0; }
        .btn-gray:hover { background-color: #eee; }
        
        .alert-error { color: #c62828; background-color: #ffebee; border-left: 4px solid #c62828; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; text-align: left; display: none; }
        .alert-success { color: #2e7d32; background-color: #e8f5e9; border-left: 4px solid #2e7d32; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; text-align: left; display: none; }

        /* Multi-Step Form Styles */
        .step { display: none; animation: fadeIn 0.4s; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .step-indicator { font-size: 12px; color: #d32f2f; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; background: #ffebee; display: inline-block; padding: 4px 12px; border-radius: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <h2>Create Account</h2>
        <p class="subtitle">Join LifeLine Connect Network</p>

        <!-- Notification Boxes -->
        <div id="jsErrorBox" class="alert-error"></div>
        <div id="jsSuccessBox" class="alert-success"></div>

        <div id="stepIndicator" class="step-indicator">Step 1 of 4</div>

        <form id="registrationForm" onsubmit="submitForm(event)">
            
            <!-- STEP 1: Account Setup -->
            <div class="step active" id="step1">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="cpassword" placeholder="Confirm password">
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-red" onclick="nextStep(1)">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 2: Personal Details -->
            <div class="step" id="step2">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" name="full_name" placeholder="E.g. Amal Perera">
                </div>
                <div class="input-group">
                    <label>NIC Number</label>
                    <input type="text" id="nic" name="nic" placeholder="E.g. 199812345678 or 981234567V">
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;">
                        <label>Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Gender</label>
                        <select id="gender" name="gender">
                            <option value="" disabled selected>Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-gray" onclick="prevStep(2)">⬅ Back</button>
                    <button type="button" class="btn btn-red" onclick="nextStep(2)">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 3: Contact & Location -->
            <div class="step" id="step3">
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="text" id="mobile" name="mobile" placeholder="E.g. 0712345678">
                </div>
                <div class="input-group">
                    <label>District</label>
                    <select id="district" name="district">
                        <option value="" disabled selected>Select District</option>
                        <option value="Colombo">Colombo</option>
                        <option value="Gampaha">Gampaha</option>
                        <option value="Kandy">Kandy</option>
                        <option value="Galle">Galle</option>
                        <option value="Matara">Matara</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Residential Address</label>
                    <textarea id="address" name="address" placeholder="Enter your full address"></textarea>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-gray" onclick="prevStep(3)">⬅ Back</button>
                    <button type="button" class="btn btn-red" onclick="nextStep(3)">Next Step ➔</button>
                </div>
            </div>

            <!-- STEP 4: Health Information -->
            <div class="step" id="step4">
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;">
                        <label>Blood Group</label>
                        <select id="bloodGroup" name="blood_group">
                            <option value="" disabled selected>Select</option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Weight (kg)</label>
                        <input type="number" id="weight" name="weight" placeholder="E.g. 65" min="40">
                    </div>
                </div>
                <div class="input-group">
                    <label>Last Donated Date (Optional)</label>
                    <input type="date" id="lastDonated" name="last_donated">
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-gray" onclick="prevStep(4)">⬅ Back</button>
                    <button type="submit" id="submitBtn" class="btn btn-red">Register Now ✅</button>
                </div>
            </div>

        </form>

        <div style="margin-top: 20px;">
            <a href="login.html" style="font-size: 13px; color: #757575; font-weight: 600; text-decoration: none;">Already have an account? Login Here</a>
        </div>
    </div>

    <!-- JavaScript Logic for Multi-Step & Validation -->
    <script>
        let currentStep = 1;
        const totalSteps = 4;

        function updateIndicator() {
            document.getElementById('stepIndicator').innerText = `Step ${currentStep} of ${totalSteps}`;
        }

        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + stepNum).classList.add('active');
            updateIndicator();
        }

        function clearErrors() {
            document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
            const errBox = document.getElementById('jsErrorBox');
            errBox.style.display = 'none';
            errBox.innerHTML = '';
        }

        function showError(msg, inputId) {
            const errBox = document.getElementById('jsErrorBox');
            errBox.innerHTML = msg;
            errBox.style.display = 'block';
            if(inputId) document.getElementById(inputId).classList.add('input-error');
        }

        function nextStep(step) {
            clearErrors();
            let isValid = true;

            // Step 1 Validation
            if (step === 1) {
                const un = document.getElementById('username').value.trim();
                const pw = document.getElementById('password').value.trim();
                const cpw = document.getElementById('cpassword').value.trim();

                if(un.length < 3) { showError("Username must be at least 3 characters.", 'username'); isValid = false; }
                else if(pw.length < 6) { showError("Password must be at least 6 characters.", 'password'); isValid = false; }
                else if(pw !== cpw) { showError("Passwords do not match.", 'cpassword'); isValid = false; }
            }
            
            // Step 2 Validation
            else if (step === 2) {
                const fn = document.getElementById('fullName').value.trim();
                const nic = document.getElementById('nic').value.trim();
                const dob = document.getElementById('dob').value;
                const gen = document.getElementById('gender').value;

                if(fn.length < 3) { showError("Full Name is required.", 'fullName'); isValid = false; }
                else if(nic.length < 10) { showError("Invalid NIC Number.", 'nic'); isValid = false; }
                else if(dob === "") { showError("Date of Birth is required.", 'dob'); isValid = false; }
                else if(gen === "") { showError("Please select Gender.", 'gender'); isValid = false; }
            }

            // Step 3 Validation
            else if (step === 3) {
                const mob = document.getElementById('mobile').value.trim();
                const dist = document.getElementById('district').value;
                const addr = document.getElementById('address').value.trim();

                if(!/^[0-9]{10}$/.test(mob)) { showError("Enter a valid 10-digit mobile number.", 'mobile'); isValid = false; }
                else if(dist === "") { showError("Please select your District.", 'district'); isValid = false; }
                else if(addr.length < 5) { showError("Please enter your residential address.", 'address'); isValid = false; }
            }

            if (isValid) {
                currentStep++;
                showStep(currentStep);
            }
        }

        function prevStep(step) {
            clearErrors();
            currentStep--;
            showStep(currentStep);
        }

        // Final Form Submit (Fetch API)
        function submitForm(event) {
            event.preventDefault();
            clearErrors();
            
            // Step 4 Validation
            const bg = document.getElementById('bloodGroup').value;
            const weight = document.getElementById('weight').value;

            if(bg === "") { showError("Please select your Blood Group.", 'bloodGroup'); return; }
            if(weight === "" || weight < 40) { showError("Weight must be at least 40kg to donate.", 'weight'); return; }

            // Submit Data
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = "Registering...";
            submitBtn.disabled = true;

            const formData = new FormData(document.getElementById('registrationForm'));

            fetch('register.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.innerHTML = "Register Now ✅";
                submitBtn.disabled = false;

                if (data.status === 'success') {
                    const successBox = document.getElementById('jsSuccessBox');
                    successBox.innerHTML = data.message;
                    successBox.style.display = 'block';
                    document.getElementById('registrationForm').reset();
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showError(data.message);
                }
            })
            .catch(error => {
                submitBtn.innerHTML = "Register Now ✅";
                submitBtn.disabled = false;
                showError("Server connection error.");
            });
        }
    </script>
</body>
</html>
