<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLine Connect - Camps Management</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f4f7fe; color: #2b3674; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #ffffff; padding: 24px 20px; border-right: 1px solid #e0e5f2; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; color: #d32f2f; }
        .brand-icon { width: 40px; height: 40px; background: #ffebee; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .brand h2 { font-size: 18px; font-weight: 700; line-height: 1.2; }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .nav-item { padding: 12px 16px; border-radius: 8px; color: #a3aed1; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #d32f2f; color: white; }
        
        .main-content { flex: 1; padding: 32px; overflow-y: auto; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h1 { font-size: 24px; color: #2b3674; font-weight: 700; }
        .user-profile { display: flex; align-items: center; gap: 16px; }
        .logout-btn { padding: 8px 16px; background: #ffebee; color: #d32f2f; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; transition: 0.2s; }
        
        .card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-bottom: 24px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .card-header h3 { font-size: 16px; color: #2b3674; font-weight: 700; }
        
        .btn-location { background: #e3f2fd; color: #1565c0; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-location:hover { background: #bbdefb; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #e0e5f2; font-size: 14px; }
        th { color: #a3aed1; font-weight: 600; font-size: 12px; text-transform: uppercase; }
        td { color: #2b3674; font-weight: 500; }
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .badge-upcoming { background: #fff3e0; color: #e65100; }
        
        #map { height: 400px; width: 100%; border-radius: 12px; z-index: 1; border: 1px solid #e0e5f2; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></div>
            <h2>LifeLine<br>Connect</h2>
        </div>
        <div class="nav-menu">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="donors.html" class="nav-item">Donors & Eligibility</a>
            <a href="camps.html" class="nav-item active">Camps & Staff</a>
            <a href="hospitals.html" class="nav-item">Hospital Requests</a>
            <a href="community.html" class="nav-item">Community Q&A</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Donation Camps Management</h1>
                <p style="font-size: 14px; color: #a3aed1; margin-top: 4px;">Live Connected to Database</p>
            </div>
            <div class="user-profile">
                <span style="font-size: 14px; font-weight: 600;">System Admin</span>
                <a href="login.html" class="logout-btn">Logout</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Upcoming Donation Camps</h3>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Camp Name</th>
                            <th>Venue</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="campsTableBody">
                        <tr><td colspan="4" style="text-align: center;">Loading camps data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Camp Venue Locations</h3>
                <button class="btn-location" onclick="findNearbyCamps()">📍 Find Nearby Camps</button>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script>
        let campLocations = [];
        const map = L.map('map').setView([7.8731, 80.7718], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        const markerGroup = L.layerGroup().addTo(map);

        document.addEventListener("DOMContentLoaded", function() {
            fetch('camps_api.php')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        campLocations = data.data;
                        const tbody = document.getElementById('campsTableBody');
                        tbody.innerHTML = '';
                        markerGroup.clearLayers();

                        if(campLocations.length === 0){
                            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No upcoming camps found.</td></tr>';
                            return;
                        }

                        campLocations.forEach(camp => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${camp.date}</td>
                                <td>${camp.name}</td>
                                <td>${camp.venue}</td>
                                <td><span class="badge badge-upcoming">${camp.status}</span></td>
                            `;
                            tbody.appendChild(tr);

                            L.marker([camp.lat, camp.lng]).addTo(markerGroup)
                                .bindPopup(`<b>${camp.name}</b><br>Venue: ${camp.venue}<br>Date: ${camp.date}`);
                        });
                    }
                })
                .catch(error => console.error('Fetch error:', error));
        });

        function findNearbyCamps() {
            if (navigator.geolocation) {
                alert("Locating you and finding nearby camps...");
                navigator.geolocation.getCurrentPosition(position => {
                    const userLatLng = L.latLng(position.coords.latitude, position.coords.longitude);
                    markerGroup.clearLayers();
                    
                    const userIcon = L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
                    });

                    L.marker(userLatLng, {icon: userIcon}).addTo(markerGroup).bindPopup("<b>📍 You are here!</b>").openPopup();

                    let found = false;
                    campLocations.forEach(camp => {
                        const campLatLng = L.latLng(camp.lat, camp.lng);
                        const distanceInKm = (userLatLng.distanceTo(campLatLng) / 1000).toFixed(1);
                        
                        if (distanceInKm <= 50) { 
                            found = true;
                            L.marker(campLatLng).addTo(markerGroup)
                                .bindPopup(`<b>${camp.name}</b><br>Venue: ${camp.venue}<br><strong style="color:#d32f2f;">Distance: ${distanceInKm} km away</strong>`);
                        }
                    });
                    map.setView(userLatLng, 10);
                    if(!found) alert("No camps found within 50km.");
                });
            }
        }
    </script>
</body>
</html>
